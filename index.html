<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Seatwork #1</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("https://i.pinimg.com/originals/89/fa/5e/89fa5e566a6f1240e54877d57ed84b5e.gif");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #form {
            background: rgba(255, 235, 184, 0.85);
            padding: 30px;
            border: 2px solid #3b3006;
            border-radius: 20px;
            width: 320px;
            max-width: 80%;
            text-align: center;
            color: rgb(58, 51, 12);
            box-shadow: 0 5px 15px rgba(252, 255, 64, 0.184);
        }

        h1 {
            color: #ca8300;
            font-size: 26px;
            margin-bottom: 10px;
        }

        h2 {
            color: #e09d15;
            font-size: 17px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 12px;
            border: 2px solid #3b3913;
            border-radius: 12px;
            background: #fffaea;
            color: #3a3112;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        button {
            background: #ff9100;
            color: #ffe460;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            margin-top: 8px;
            font-weight: bold;
        }

        #output1 {
            margin-top: 20px;
            color: #524213e6;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
</head>

<body>

    <div id="form">
        <h1>Volleyball Varsity</h1>
        <h2>Candidate Verification Check! ♡</h2>

        <form action="">
            <input type="text" id="input1" placeholder="First name">
            <input type="text" id="input2" placeholder="Last name">

            <br>
            <button type="button" py-click="add_names">Verify!</button>
        </form>

        <div id="output1"></div>
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
